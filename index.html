<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kubearc DevOps Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 25px;
      max-width: 420px;
      width: 95%;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .college {
      font-size: 20px;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    .badge {
      background: #00c853;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      margin: 10px 0;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff9800;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    button:active {
      transform: scale(0.95);
    }

    .version {
      margin-top: 25px;
      font-size: 16px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 Kubearc</h1>
    
    <div class="college">
      Guru Nanak Dev Engineering College, Ludhiana
    </div>

    <div class="badge">Live DevOps Demo</div>

    <p>This app is running on a cloud server.</p>
    <p id="message">Version 1 - Welcome Students!</p>

    <button onclick="changeText()">Click Me</button>

    <div class="version">
      Updated at: <span id="time"></span>
    </div>
  </div>

  <script>
    function changeText() {
      document.getElementById("message").innerText = "🔥 You clicked the button!";
    }

    document.getElementById("time").innerText = new Date().toLocaleTimeString();
  </script>
</body>
</html>
